
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Калькулятор маржи</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 20px auto;
        }

        label, select, input {
            display: block;
            margin: 10px 0;
            width: 100%;
        }

        .result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <h2>Калькулятор маржи</h2>

    <label>Сумма от заказчика (с НДС):</label>
    <input type="number" id="clientAmount" placeholder="Например, 120000" />

    <label>НДС у заказчика:</label>
    <select id="clientVatRate">
        <option value="20">20%</option>
        <option value="10">10%</option>
        <option value="7">7%</option>
        <option value="5">5%</option>
        <option value="0">Без НДС</option>
    </select>

    <label>Сумма перевозчику:</label>
    <input type="number" id="carrierAmount" placeholder="Например, 85000" />

    <label>НДС у перевозчика:</label>
    <select id="carrierVatRate">
        <option value="20">20%</option>
        <option value="10">10%</option>
        <option value="7">7%</option>
        <option value="5">5%</option>
        <option value="0">Без НДС</option>
    </select>

    <button onclick="calculateMargin()">Рассчитать</button>

    <div class="result" id="resultBox"></div>

    <script>
        function calculateMargin() {
            const clientAmount = parseFloat(document.getElementById("clientAmount").value);
            const carrierAmount = parseFloat(document.getElementById("carrierAmount").value);
            const clientVat = parseFloat(document.getElementById("clientVatRate").value);
            const carrierVat = parseFloat(document.getElementById("carrierVatRate").value);

            if (isNaN(clientAmount) || isNaN(carrierAmount)) {
                document.getElementById("resultBox").innerText = "Введите корректные суммы.";
                return;
            }

            const clientNet = clientVat === 0 ? clientAmount : clientAmount - (clientAmount * clientVat / (100 + clientVat));
            const carrierNet = carrierVat === 0 ? carrierAmount : carrierAmount - (carrierAmount * carrierVat / (100 + carrierVat));
            const margin = clientNet - carrierNet;

            document.getElementById("resultBox").innerHTML =
                `<strong>Маржа перевозки:</strong> ${margin.toFixed(2)} ₽<br />
             <small>(Чистый приход заказчика: ${clientNet.toFixed(2)} ₽, Чистый расход: ${carrierNet.toFixed(2)} ₽)</small>`;
        }
    </script>

<button onclick="loadDealData()">Загрузить из сделки</button>
<p id="dealStatus" style="color: red;"></p>

<script>
async function loadDealData() {
    const urlParams = new URLSearchParams(window.location.search);
    const dealId = urlParams.get('deal_id');

    if (!dealId) {
        document.getElementById("dealStatus").innerText = "ID сделки не найден. Откройте приложение из карточки сделки.";
        return;
    }

    document.getElementById("dealStatus").innerText = "Загрузка данных...";

    try {
        const response = await fetch("https://b-s-l.bitrix24.ru/rest/20/szpqcc8xp5ek5t5i/crm.deal.get.json", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({ ID: dealId })
        });

        const result = await response.json();

        if (result && result.result) {
            document.getElementById("dealStatus").innerText = "Данные сделки успешно загружены.";
            window.dealData = result.result;
            console.log("Данные сделки:", result.result);
            // Здесь позже можно добавить сопоставление с полями формы
        } else {
            document.getElementById("dealStatus").innerText = "Ошибка загрузки данных сделки.";
        }
    } catch (error) {
        document.getElementById("dealStatus").innerText = "Сетевая ошибка при загрузке данных.";
        console.error(error);
    }
}
</script>


<script>
function loadDealData() {
    document.getElementById("dealStatus").innerText = "Загрузка данных из сделки...";

    if (typeof BX24 === "undefined") {
        document.getElementById("dealStatus").innerText = "Интерфейс BX24 недоступен. Откройте приложение из сделки Bitrix24.";
        return;
    }

    BX24.init(function() {
        BX24.getPlacementOptions(function(options) {
            const dealId = options.ID || options.ENTITY_ID;
            if (!dealId) {
                document.getElementById("dealStatus").innerText = "ID сделки не найден через BX24.";
                return;
            }

            fetch("https://b-s-l.bitrix24.ru/rest/20/szpqcc8xp5ek5t5i/crm.deal.get.json", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({ ID: dealId })
            })
            .then(response => response.json())
            .then(result => {
                if (result && result.result) {
                    document.getElementById("dealStatus").innerText = "Данные сделки успешно загружены.";
                    window.dealData = result.result;
                    console.log("Данные сделки через BX24:", result.result);
                } else {
                    document.getElementById("dealStatus").innerText = "Ошибка при загрузке сделки.";
                }
            })
            .catch(error => {
                console.error(error);
                document.getElementById("dealStatus").innerText = "Ошибка сети при запросе сделки.";
            });
        });
    });
}
</script>

</body>
</html>
